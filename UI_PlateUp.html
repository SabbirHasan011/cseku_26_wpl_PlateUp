<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open PlateUp</title>
</head>
<body>
  <p>PlateUp now starts from its application shell. Run <code>npm start</code>, then <a href="http://localhost:5000/">open PlateUp</a>.</p>
  <script>
    const base = location.protocol === 'file:' || location.port === '5500'
      ? 'http://' + (location.hostname || 'localhost') + ':5000/' : '/';
    location.replace(base + location.search + location.hash);
  </script>
</body>
</html>
