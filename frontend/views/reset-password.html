<div id="reset-password" class="screen">
    <form id="reset-form" class="auth-container" data-submit="resetPassword"><h2>Set a new password</h2><div class="form-group"><label for="reset-new">New password</label><input id="reset-new" type="password" autocomplete="new-password" minlength="8" required></div><div class="form-group"><label for="reset-confirm">Confirm password</label><input id="reset-confirm" type="password" autocomplete="new-password" minlength="8" required></div><p id="reset-feedback" role="status"></p><button id="reset-submit" class="btn-pri">Reset password</button><button type="button" class="btn-sec" data-click="openForgotPassword">Request a new link</button></form>
  </div>
