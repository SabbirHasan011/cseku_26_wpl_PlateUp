<div id="recovery" class="screen">
    <form class="auth-container" data-submit="requestPasswordReset"><h2>Forgot your password?</h2><p>Enter your account email to request a reset link.</p><div class="form-group"><label for="recovery-email">Email</label><input id="recovery-email" type="email" autocomplete="email" required></div><p id="recovery-feedback" role="status"></p><button id="recovery-submit" class="btn-pri">Send reset link</button><button class="btn-sec" type="button" data-click="showScreen" data-arg0="login">Back to sign in</button></form>
  </div>
